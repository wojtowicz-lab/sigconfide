site_name: sigconfide
site_description: Mutational signature exposure fitting and selection
repo_url: https://github.com/wojtowicz-lab/sigconfide
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
nav:
  - Home: index.md
  - API reference: reference.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.mkdocs/pkg]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
hooks:
  - .mkdocs/hooks.py
